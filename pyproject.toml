[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "3d-swin-unetr-medical"
version = "1.0.0"
description = "Self-Supervised 3D Swin Transformers (Swin-UNETR) with 3D-MAE Pre-Training for Volumetric Medical Image Segmentation"
readme = "README.md"
authors = [{ name = "Naman Chopra", email = "naman.chopra025@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "monai>=1.3.0",
    "pytorch-lightning>=2.1.0",
    "nibabel>=5.1.0",
    "scipy>=1.10.0",
    "numpy>=1.22.0",
    "matplotlib>=3.6.0",
    "pyyaml>=6.0",
    "einops>=0.7.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/naman-chopra/3d-swin-unetr-medical"
Repository = "https://github.com/naman-chopra/3d-swin-unetr-medical"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
