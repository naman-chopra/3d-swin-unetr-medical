# ==============================================================================
# Stage 1: Self-Supervised 3D Masked Autoencoder Pre-Training Configuration
# ==============================================================================

system:
  seed: 42
  amp: true  # Automatic Mixed Precision (FP16/BF16)

data:
  data_dir: "data"
  task_name: "Task01_BrainTumour"
  roi_size: [96, 96, 96]
  batch_size: 1  # Optimized for 6GB Laptop GPU VRAM
  num_workers: 4
  cache_rate: 0.1  # Memory-safe cache rate for system RAM

model:
  in_channels: 4  # 4 MRI modalities: T1, T1ce, T2, FLAIR
  img_size: [96, 96, 96]
  patch_size: [16, 16, 16]
  embed_dim: 384
  encoder_depth: 8
  num_heads: 6
  decoder_embed_dim: 192
  decoder_depth: 4
  decoder_num_heads: 4
  mask_ratio: 0.75  # 75% 3D voxel patch masking

training:
  max_epochs: 20  # Fast initial pre-training milestone
  lr: 1.5e-4
  weight_decay: 0.05
