# ==============================================================================
# Stage 2: 3D Swin-UNETR Downstream Volumetric Fine-Tuning Configuration
# ==============================================================================

system:
  seed: 42
  amp: true  # Automatic Mixed Precision for VRAM efficiency

data:
  data_dir: "data"
  task_name: "Task01_BrainTumour"
  roi_size: [96, 96, 96]
  batch_size: 1  # Memory-safe for 6GB Laptop GPU VRAM
  num_workers: 4
  cache_rate: 0.0

model:
  in_channels: 4   # 4 MRI sequences (T1, T1ce, T2, FLAIR)
  out_channels: 4  # Background + 3 Brain Tumor Subregions (WT, TC, ET)
  img_size: [96, 96, 96]
  feature_size: 24  # Optimal for 6GB Laptop GPU VRAM
  depths: [2, 2, 2, 2]
  num_heads: [3, 6, 12, 24]
  use_checkpoint: true
  pretrained_checkpoint: null  # Optional: path to pre-trained Swin-UNETR checkpoint

training:
  max_epochs: 30
  lr: 2.0e-4
  weight_decay: 1.0e-2
  loss_type: "dice_ce"
